// Language: ?lang=, else the last choice, else the browser's; the choice is kept in localStorage when allowed.
const storedLanguage = () => { try { return localStorage.getItem("dashboard.lang"); } catch { return null; } };
let lang = [new URLSearchParams(location.search).get("lang"), storedLanguage(), navigator.language.slice(0, 2)]
  .find(code => code in texts) ?? "en";
const t = key => texts[lang][key];

const refreshSeconds = Number(new URLSearchParams(location.search).get("refresh")) || 600;
const rank = { TODO: 0, WIP: 1, WAIT: 2, OK: 3 };
let nextRefresh = 0, loading = false, lastData = null;

const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const cap = text => text.replace(/^./, c => c.toUpperCase());
const ago = iso => {
  if (!iso) return "";
  const hours = (Date.now() - new Date(iso)) / 36e5;
  return hours < 1 ? "< 1 h" : hours < 48 ? `${Math.round(hours)} h` : `${Math.round(hours / 24)} ${t("day")}`;
};

// What a pull request asks of me, as [status, hint].
function prAction(pr) {
  if (pr.status === "completed") return ["OK", t("merged")];
  if (pr.status === "abandoned") return ["OK", t("abandoned")];
  if (pr.mergeStatus === "conflicts") return ["TODO", t("conflicts")];
  if (pr.isMine) {
    if (pr.isDraft) return ["TODO", t("draft")];
    if (pr.ci?.status === "failed") return ["TODO", t("ciFailed")];
    if (pr.ci?.status === "expired") return ["TODO", t("ciRequeue")];
    if (pr.openThreads > 0) return ["TODO", t("openThreads")(pr.openThreads)];
    if (pr.reviewers.some(r => r.vote < 0)) return ["TODO", t("reviewerWaiting")];
    const required = pr.reviewers.filter(r => r.isRequired && !r.isMe);
    const approved = (required.length ? required : pr.reviewers.filter(r => !r.isMe)).every(r => r.vote >= 5);
    if (approved && pr.reviewers.length)
      return pr.ci?.status === "running" ? ["WAIT", t("approvedCiRunning")] : ["TODO", t("readyToMerge")];
    return ["WAIT", t("waitingReviewers")];
  }
  const me = pr.reviewers.find(r => r.isMe);
  if (me?.vote > 0) return ["OK", t("approvedByMe")];
  // Not approved yet: to review until I comment or vote, then waiting for the author, and back to me as soon as
  // the author pushes or answers after my last action.
  const after = date => date && new Date(date) > new Date(pr.myLastAction);
  if (!pr.myLastAction) return me?.vote < 0 ? ["WAIT", t("waitingAuthor")] : ["TODO", t("toReview")];
  if (after(pr.lastPush)) return ["TODO", t("reviewAgainPush")];
  if (after(pr.authorLastComment)) return ["TODO", t("reviewAgainReply")];
  return ["WAIT", me?.vote < 0 ? t("waitingAuthor") : t("reviewed")];
}

// What a PBI asks of me, as [status, reason]: the most urgent of its active PRs, else its state.
function itemAction(item) {
  const active = item.pullRequests.filter(pr => pr.status === "active").map(pr => [pr, ...prAction(pr)]);
  if (active.length) {
    const [pr, status, hint] = active.reduce((a, b) => (rank[b[1]] < rank[a[1]] ? b : a));
    return [status, `PR ${pr.id} : ${hint}`];
  }
  if (/hold|blocked/i.test(item.state)) return ["WAIT", t("reasonOnHold")(item.state)];
  if (item.pullRequests.length && /code review|testing/i.test(item.state)) return ["WAIT", t("reasonMerged")(item.state)];
  return ["WIP", t("reasonInProgress")];
}

// Obsidian links between notes, [[Folder/Note|text]] or [[Note#Section]], become markdown links to the note's file
// from the root of the vault ("/Folder/Note.md"), which the reader opens (see vaultPath).
const wikilinks = text => text.replace(/\[\[([^\]|#\n]+)(?:#[^\]|\n]*)?(?:\|([^\]\n]+))?\]\]/g,
  (_, target, alias) => `[${alias ?? target.trim().split("/").pop()}](</${target.trim()}${/\.md$/i.test(target.trim()) ? "" : ".md"}>)`);
// Markdown files of the vault: reviews (Reviews/<pr>-review.md, <pr>-threads.md) and PBI working files
// (PBIs/pbi-<id>/<step>.md), keyed "review:<pr>" / "threads:<pr>" / "pbi:<id>:<step>". Rendered with marked and
// sanitized with DOMPurify; raw text if the CDN is unreachable.
const documents = new Map();
const markdown = text => window.marked && window.DOMPurify
  ? DOMPurify.sanitize(marked.parse(wikilinks(text)), { ADD_ATTR: ["target"] })
  : `<pre>${esc(text)}</pre>`;
// HTML written in Azure DevOps (a PBI's description): sanitized, or its text alone if the CDN is unreachable. Its
// inline styles go too: colors pasted into Azure DevOps would fight the page's theme (black text in dark mode).
const safeHtml = html => window.DOMPurify ? DOMPurify.sanitize(html, { FORBID_ATTR: ["style"] }) : esc(html.replace(/<[^>]+>/g, " "));
const section = (text, name) => {
  const match = text.match(new RegExp(`^##\\s+${name}\\s*$([\\s\\S]*?)(?=^##\\s|(?![\\s\\S]))`, "m"));
  return match ? match[1].trim() : "";
};
// Reports come in English, with a French translation under "fr" when the session wrote one: show it in French.
const localized = report => report && lang === "fr" && report.fr ? report.fr : report;
// PBI working files (PBIs/pbi-<id>/00-status.md ... 07-pr-description.md, rule in the workspace CLAUDE.md). Each starts
// with a YAML frontmatter (updated, session, sessions, and step / next / blockedBy for the status): flat "key: value"
// lines are enough here. A "#" comment needs a space after it, so "#247129" stays in a value.
const frontmatter = text => {
  const match = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(text ?? "");
  const fields = {};
  if (match) match[1].split(/\r?\n/).forEach(line => {
    const field = /^(\w+):\s*(.*?)(?:\s+#\s.*)?$/.exec(line);
    if (field) fields[field[1]] = field[2].trim().replace(/^(["'])(.*)\1$/, "$2");
  });
  return { fields, body: match ? text.slice(match[0].length) : text ?? "" };
};
const pbiSteps = ["01-summary", "02-analysis", "03-job-done", "04-ai-review", "05-test-instructions", "06-open-questions", "07-pr-description"];
// The status file of a PBI in the page language, with its frontmatter fields (step, next, blockedBy) and its text.
const statusOf = item => {
  const file = localized(item.files?.["00-status"]);
  return file ? { file, ...frontmatter(file.markdown) } : null;
};

// A file of the vault as the dialog shows it: its frontmatter becomes one line above the text, with its last change
// and the sessions that wrote it.
const docText = doc => {
  const { fields, body } = frontmatter(doc.markdown);
  return (fields.session ? `*${t("writtenBy")(ago(fields.updated || doc.updated), fields.sessions || fields.session)}*\n\n` : "") + body;
};

// The documents the dialog opens, in the page language.
function registerDocuments() {
  documents.clear();
  const add = (key, report, label) => {
    const doc = localized(report);
    if (!doc) return;
    documents.set(key, { file: `${doc.file} · ${label}`, path: doc.file, markdown: docText(doc) });
  };
  lastData.workItems.forEach(item => ["00-status", "06-open-questions"].forEach(step => add(`pbi:${item.id}:${step}`, item.files?.[step], `#${item.id}`)));
}

function openDocument(key) {
  const doc = documents.get(key);
  if (!doc) return;
  readerTrail.length = 0;
  readerTrail.push(doc.path);
  showDialog(doc.file, markdown(doc.markdown), doc.path);
}

// The dialog is the reader of the vault's markdown files: `file` (relative to the vault) is what the links of the
// text shown are relative to, and Back returns to the file the last link was followed from.
const readerTrail = [];
function showDialog(title, html, file = "") {
  document.getElementById("reviewFile").textContent = title;
  document.getElementById("reviewBack").hidden = readerTrail.length < 2;
  const body = document.getElementById("reviewBody");
  body.dataset.vault = file;
  body.innerHTML = html;
  body.querySelectorAll("a").forEach(a => a.target = "_blank");
  const dialog = document.getElementById("reviewDialog");
  if (!dialog.open) dialog.showModal();
  dialog.scrollTop = 0;
}

// The file of the vault a link of a vault text points to, or null for any other link (a site, an anchor). A text of the vault sits in an element whose data-vault is its file: a relative link starts from
// the folder of that file, a link that starts with "/" from the root of the vault.
function vaultPath(link) {
  const href = link.getAttribute("href");
  if (/^([a-z][a-z0-9+.-]*:|#|\/\/)/i.test(href)) return null;
  let path;
  try { path = decodeURIComponent(href.split(/[?#]/)[0]); } catch { return null; }
  const parts = path.startsWith("/") ? [] : link.closest("[data-vault]").dataset.vault.split("/").slice(0, -1);
  path.split("/").forEach(part => { if (part === "..") parts.pop(); else if (part && part !== ".") parts.push(part); });
  return parts.join("/");
}

// A link to another file of the vault opens in the reader instead of leaving the page: on a click, and on a middle
// click too, which would open a new tab on an address the server does not have.
function openVaultLink(event) {
  const link = event.target.closest?.("[data-vault] a[href]"), file = link && vaultPath(link);
  if (file) { event.preventDefault(); openVaultFile(file); }
}
document.addEventListener("auxclick", openVaultLink);

// Opens a markdown file of the vault in the reader (GET /api/vault).
async function openVaultFile(path) {
  // Another kind of file (a PDF, an image) is in the vault too, but the reader only shows markdown: it says so
  // instead of sending the browser to an address the server does not have.
  const isMarkdown = /\.md$/i.test(path);
  let doc = null;
  try {
    const response = isMarkdown && await fetch(`/api/vault?path=${encodeURIComponent(path)}`);
    if (response?.ok) doc = await response.json();
  } catch { }
  if (readerTrail.at(-1) !== path) readerTrail.push(path);
  showDialog(doc?.file ?? path, doc ? markdown(docText(doc)) : `<p class="bad">${esc(t(isMarkdown ? "fileMissing" : "fileNotMarkdown")(path))}</p>`, doc?.file ?? path);
}

// A comment thread of a pull request, whole: its file and line, a link to Azure DevOps and its comments.
const plainText = text => String(text ?? "").replace(/[`*_>#\[\]]/g, "").replace(/\s+/g, " ").trim();
const conversationHtml = thread => `<div class="conversation">
    <div class="where">${thread.file ? `<code>${esc(thread.file)}${thread.line ? `:${thread.line}` : ""}</code>` : `<span>${esc(t("prLevelThread"))}</span>`}
      <a href="${esc(thread.url)}" target="_blank">${esc(t("openInAdo"))}</a></div>
    ${thread.comments.map(comment => `<div class="comment"><b>${esc(comment.author)}</b> <span class="muted">· ${esc(t("since")(ago(comment.date)))}</span>
      <div class="markdown">${markdown(comment.content ?? "")}</div></div>`).join("")}
  </div>`;

// A pull request in one sentence: conflicts, draft, comment threads and the state of its Build policies (the CI
// links to the build). A thread counts once whatever its replies; system threads are left out by the server.
const threadsText = pr => pr.totalThreads == null ? "" : pr.totalThreads === 0 ? t("noThread")
  : pr.openThreads === 0 ? t("allResolved") : t("openOf")(pr.openThreads, pr.totalThreads);
const ciHtml = pr => {
  if (!pr.ci) return "";
  const text = esc(t("ci")[pr.ci.status] ?? `CI ${pr.ci.status}`);
  return pr.ci.buildUrl ? `<a href="${esc(pr.ci.buildUrl)}" target="_blank">${text}</a>` : text;
};
const signals = pr => {
  const parts = [pr.mergeStatus === "conflicts" && t("conflictsBadge"), pr.isDraft && t("draftBadge"), threadsText(pr)].filter(Boolean);
  // The capital goes to the first word of the sentence, whichever part it is.
  return [...parts.map((text, index) => esc(index ? text : cap(text))), ciHtml(pr)].filter(Boolean).join(" · ");
};
const votesText = pr => pr.reviewers.length
  ? pr.reviewers.map(r => r.isMe ? `<b>${esc(t("myVotes")[r.vote] ?? r.vote)}</b>` : `${esc(r.name)} ${esc(t("votes")[r.vote] ?? r.vote)}`).join(" · ")
  : esc(t("noReviewer"));

// Button that opens a Claude session in a new Windows Terminal tab (POST /api/sessions/<kind>/<id>).
const claudeButton = (kind, id, label, title, cls = "") =>
  `<button class="${cls}" data-claude="${kind}/${id}" data-label="${label}"${title ? ` title="${esc(title)}"` : ""}>${esc(t(label))}</button>`;
// Shown only when the pull request has unresolved threads.
const threadsButton = (pr, cls) => pr.openThreads > 0
  && claudeButton("threads", pr.id, "claudeThreads", t("threadsTitle")(pr.openThreads, pr.totalThreads - pr.openThreads), cls);
// Resume the last review or thread analysis of a pull request (Reviews/sessions.jsonl), next to the button that starts a new one.
const sessionDate = session => new Date(session.startedAt).toLocaleString(t("locale"), { dateStyle: "short", timeStyle: "short" });
const resumeReviewButton = (pr, cls) => pr.reviewSession
  && claudeButton("review-resume", pr.id, "claudeResumeReview", t("claudeResumeTitle")(sessionDate(pr.reviewSession)), cls);
const resumeThreadsButton = (pr, cls) => pr.threadsSession
  && claudeButton("threads-resume", pr.id, "claudeResumeThreads", t("claudeResumeTitle")(sessionDate(pr.threadsSession)), cls);
// The main action of a PBI: resume its last session, else start one (not once it is Implemented).
const implemented = item => /^implemented$/i.test(item.state);
const pbiPrimary = (item, cls) => item.lastSession
  ? claudeButton("resume", item.id, "claudeResume", t("claudeResumeTitle")(sessionDate(item.lastSession)), cls)
  : implemented(item) ? "" : claudeButton("pbi", item.id, "claudePbi", "", cls);
const docLink = (key, text) => `<button class="link" data-doc="${key}">${esc(text)}</button>`;

// Returns the JSON the server sent back, if any (the reviewer outcome of a typed PR).
async function openClaude(button, target = button.dataset.claude, query = button.dataset.query ?? "") {
  button.disabled = true;
  let ok = false, result = null;
  try {
    // The page language is the language Claude answers in, and adds a French copy of the report.
    const response = await fetch(`/api/sessions/${target}?lang=${lang}${query}`, { method: "POST", headers: { "X-Dashboard": "1" } });
    ok = response.ok;
    if (response.headers.get("content-type")?.includes("json")) result = await response.json();
  } catch { }
  button.textContent = t(ok ? "claudeOpened" : "claudeFailed");
  button.classList.add(ok ? "done" : "failed");
  setTimeout(() => {
    button.disabled = false;
    button.classList.remove("done", "failed");
    button.textContent = t(button.dataset.label);
    // A new PBI session is recorded on the server: refresh so its card gets the Resume button.
    if (ok && target.startsWith("pbi/")) load();
  }, 4000);
  return result;
}

// A row of the Today tab: the pill says what it asks of me, then what it is, one useful sentence and one main
// action. The title and Details open the page of the PBI or of the pull request, where everything else is.
const pill = (status, text, extra = "") => `<span class="pill ${status} ${extra}">${esc(text)}</span>`;
const orderPill = (order, sprint) => order ? `<span class="order" title="${esc(t("backlogOrderTitle")(sprint ?? ""))}">${order}</span>` : "";

function rowHtml({ status, pillText, order = "", meta, title, href, line, lineClass = "", primary }) {
  return `<article class="row ${status}">
    <div class="row-main"><div class="row-text">
        <div class="row-meta">${order}${pill(status, pillText)}<span>${meta}</span></div>
        <h3><a href="${href}">${esc(title)}</a></h3>
        ${line ? `<div class="row-line ${lineClass}">${line}</div>` : ""}</div>
      <div class="row-actions">${primary || ""}<a class="btn" href="${href}">${esc(t("details"))}</a></div></div></article>`;
}

function reviewRow(pr) {
  const [status, hint] = prAction(pr);
  // Once I approved and wrote a review, the main action is to read it again; else to review.
  const readFirst = status === "OK" && pr.review;
  return { status, activity: latest(pr.lastActivity, pr.review?.updated), html: rowHtml({
    status, pillText: cap(hint),
    meta: `PR ${pr.id} · ${esc(pr.repository)} · ${esc(pr.author)} · ${esc(t("since")(ago(pr.createdDate)))}`,
    title: pr.title, href: `#pr/${pr.id}`, line: signals(pr),
    primary: readFirst ? `<a class="btn" href="#pr/${pr.id}/review">${esc(t("readMyReview"))}</a>`
      : claudeButton("review", pr.id, "claudeReview", "", status === "TODO" ? "primary" : "") }) };
}

// History of a PBI: state, sprint and assignment changes from Azure DevOps, PRs created and closed, Claude sessions,
// newest first.
const shortDate = iso => new Date(iso).toLocaleDateString(t("locale"), { day: "2-digit", month: "2-digit" });
const shortDateTime = iso => `${shortDate(iso)} ${new Date(iso).toLocaleTimeString(t("locale"), { hour: "2-digit", minute: "2-digit" })}`;

function historyEvents(item) {
  const events = (item.history ?? []).map(event => ({ ...event }));
  item.pullRequests.forEach(pr => {
    if (pr.createdDate) events.push({ type: "prCreated", date: pr.createdDate, by: pr.author, pr: pr.id });
    if (pr.closedDate && pr.status !== "active") events.push({ type: pr.status === "completed" ? "prMerged" : "prAbandoned", date: pr.closedDate, pr: pr.id });
  });
  (item.sessions ?? []).forEach(session => events.push({ type: "session", date: session.startedAt }));
  return events.sort((a, b) => new Date(b.date) - new Date(a.date));
}

const itemActivity = item => latest(item.changedDate, item.lastSession?.startedAt, ...item.pullRequests.map(pr => pr.lastActivity),
  ...Object.values(item.files ?? {}).map(file => file.updated));

function itemRow(item) {
  const [status, reason] = itemAction(item);
  const state = statusOf(item);
  const activity = itemActivity(item);
  // The one sentence: what blocks, else the next action, else when it last moved.
  const [lineClass, line] = state?.fields.blockedBy ? ["bad", `${esc(t("blockedBy"))} ${esc(state.fields.blockedBy)}`]
    : state?.fields.next ? ["", `<span class="muted">${esc(t("nextAction"))}</span> ${esc(state.fields.next)}`]
    : ["muted", esc(t("changed")(ago(activity)))];
  return { status, activity, html: rowHtml({
    status, pillText: t("statusNames")[status], order: orderPill(item.backlogOrder, item.iteration),
    // The sprint only when the filter shows several.
    meta: [`#${item.id}`, selectedSprints.size !== 1 && item.iteration, item.state, reason].filter(Boolean).map(esc).join(" · "),
    title: item.title, href: `#pbi/${item.id}`, line, lineClass, primary: pbiPrimary(item, status === "TODO" ? "primary" : "") }) };
}

// Most recent of some ISO dates (missing ones ignored), as an ISO string.
function latest(...dates) {
  const times = dates.filter(Boolean).map(date => new Date(date).getTime());
  return times.length ? new Date(Math.max(...times)).toISOString() : null;
}

// Rows go by status (to do, in progress, waiting, done), then by last activity, most recent first.
function fill(id, rows, empty) {
  rows.sort((a, b) => rank[a.status] - rank[b.status] || (b.activity ?? "").localeCompare(a.activity ?? ""));
  document.getElementById(id).innerHTML = rows.length ? rows.map(row => row.html).join("") : `<div class="empty">${esc(empty)}</div>`;
  document.getElementById(`${id}Count`).textContent = `· ${rows.length}`;
  return rows;
}

// Sprint filter on my PBIs: one chip per sprint, several can be on. An empty selection means all sprints. It starts
// on the current sprint and is kept in localStorage; a sprint that no longer has PBIs drops out.
let selectedSprints = null;
const sprintOf = item => item.iterationPath?.includes("\\") ? item.iterationPath : "";
const sprintLabel = path => path ? path.split("\\").pop() : t("noSprint");

function sprintsFilter() {
  const counts = new Map();
  lastData.workItems.forEach(item => counts.set(sprintOf(item), (counts.get(sprintOf(item)) ?? 0) + 1));
  const sprints = [...counts.keys()].sort((a, b) => (a === "") - (b === "") || a.localeCompare(b, undefined, { numeric: true }));
  const current = lastData.currentSprint?.path;
  if (selectedSprints === null) {
    let stored = null;
    try { stored = JSON.parse(localStorage.getItem("dashboard.sprints")); } catch { }
    selectedSprints = new Set(Array.isArray(stored) ? stored : counts.has(current) ? [current] : []);
  }
  selectedSprints.forEach(path => { if (!counts.has(path)) selectedSprints.delete(path); });

  const chip = (value, label, on) => `<button data-sprint="${esc(value)}" aria-pressed="${on}" class="${on ? "on" : ""}">${esc(label)}</button>`;
  document.getElementById("sprints").innerHTML =
    sprints.map(path => chip(path, sprintLabel(path) + (path === current ? ` · ${t("currentSprint")}` : ""), selectedSprints.has(path))).join("")
    + chip("*", t("allSprints"), !selectedSprints.size);
  return lastData.workItems.filter(item => !selectedSprints.size || selectedSprints.has(sprintOf(item)));
}

function toggleSprint(value) {
  if (value === "*") selectedSprints.clear();
  else if (selectedSprints.has(value)) selectedSprints.delete(value);
  else selectedSprints.add(value);
  try { localStorage.setItem("dashboard.sprints", JSON.stringify([...selectedSprints])); } catch { }
  render();
}

// Draws the rows of the last data; called after each refresh and when the language changes.
function render() {
  if (!lastData) return;
  registerDocuments();
  const items = sprintsFilter();
  const all = [...fill("reviews", lastData.reviews.map(reviewRow), t("emptyReviews")),
               ...fill("items", items.map(itemRow), t(lastData.workItems.length ? "emptyFilter" : "emptyItems"))];
  const count = status => all.filter(row => row.status === status).length;
  document.getElementById("counts").innerHTML = [["TODO", "todo"], ["WIP", "wip"], ["WAIT", "wait"], ["OK", "done"]]
    .map(([status, label]) => `<span class="legend ${status}" title="${esc(t("statusHelp")[status])}"><i></i>${esc(t(label)(count(status)))}</span>`)
    .join("");
  todoCount = count("TODO");
  updateTabIcon();
  renderQuestions();
  renderSearch();
  renderPbi();
  renderPr();
}

// The page of one PBI (#pbi/<id>/<tab>): its header (backlog order, status, description folded to four lines), the
// next action of its status file, then one tab per working file of the vault, its pull requests and its history.
let pbiRoute = null, descOpen = false;
// Language of the working files shown; follows the page language until the FR / EN switch of a file is used.
let docLang = null;

function renderPbi() {
  if (!pbiRoute) return;
  const view = document.getElementById("pbiView");
  if (!lastData) { view.innerHTML = pagePlaceholder(); return; }
  const item = lastData.workItems.find(workItem => workItem.id === pbiRoute.id);
  if (!item) { view.innerHTML = `<div>${backLink()}</div><div class="empty">${esc(t("pbiNotFound")(pbiRoute.id))}</div>`; return; }

  const [status] = itemAction(item);
  const state = statusOf(item), keptForm = formValues(view);
  const tabs = [...pbiSteps, ...(item.pullRequests.length ? ["pr"] : []), "history"];
  const tab = tabs.includes(pbiRoute.tab) ? pbiRoute.tab
    : item.files?.[state?.fields.step] ? state.fields.step : pbiSteps.find(step => item.files?.[step]) ?? pbiSteps[0];
  const openThreads = item.pullRequests.reduce((sum, pr) => sum + (pr.openThreads ?? 0), 0);
  const tabLink = name => {
    const step = pbiSteps.includes(name);
    const label = step ? t("steps")[name] : name === "pr" ? t("tabPr") : t("history");
    const waiting = name === "06-open-questions" && questions.filter(q => q.pbi === item.id && stateOf(q) === "waiting").length;
    const tag = waiting ? pill("TODO", t("qCounts").waiting(waiting), "small")
      : name === state?.fields.step ? pill("step", t("currentStep"), "small")
      : name === "pr" && openThreads ? pill("TODO", t("openThreads")(openThreads), "small") : "";
    return `${name === "pr" || (name === "history" && !tabs.includes("pr")) ? '<span class="sep" aria-hidden="true"></span>' : ""}
      <a href="#pbi/${item.id}/${name}" role="tab" aria-selected="${name === tab}" class="${name === tab ? "on" : ""} ${step && !item.files?.[name] && !(name === "06-open-questions" && questions.some(q => q.pbi === item.id)) ? "missing" : ""}">${esc(label)}${tag}</a>`;
  };
  const description = [item.description, item.acceptanceCriteria && `<h4>${esc(t("acceptance"))}</h4>${item.acceptanceCriteria}`].filter(Boolean).join("");
  const firstLine = state && plainText(state.body.split(/\r?\n/).find(line => line.trim()) ?? "");

  view.innerHTML = `<div class="links">${backLink()}<a href="${esc(item.url)}" target="_blank" style="margin-left:auto">${esc(t("openInAdo"))}</a></div>
    <div class="pbi-head">
      <div class="row-meta">${orderPill(item.backlogOrder, item.iteration)}${pill(status, t("statusNames")[status])}
        <span>${[`#${item.id}`, item.type, item.iteration, item.state, item.tags, t("lastActivity")(ago(itemActivity(item)))].filter(Boolean).map(esc).join(" · ")}</span></div>
      <h1>${esc(item.title)}</h1>
    </div>
    ${description ? `<div class="desc-block"><div class="label">${esc(t("description"))}</div>
      <div class="desc markdown ${descOpen ? "open" : ""}">${safeHtml(description)}</div>
      <div><button class="link" data-desc-toggle aria-expanded="${descOpen}">${esc(t(descOpen ? "descLess" : "descMore"))}</button></div></div>` : ""}
    <section class="row banner"><div class="row-text">
        ${state ? `<div class="label">${esc(t("nextHead")(ago(state.fields.updated || state.file.updated)))}</div>
          <div class="next">${esc(state.fields.next || firstLine)}</div>
          <div class="${state.fields.blockedBy ? "bad" : "muted"}">${state.fields.blockedBy ? `${esc(t("blockedBy"))} ${esc(state.fields.blockedBy)}` : esc(t("notBlocked"))}
            · ${docLink(`pbi:${item.id}:00-status`, t("readStatus"))}</div>`
          : `<div class="muted">${esc(t("noStatus"))}</div>`}</div>
      <span class="row-actions">${item.lastSession && !implemented(item) ? claudeButton("pbi", item.id, "claudePbi", "", "link") : ""}${pbiPrimary(item, "primary")}</span></section>
    <div class="steptabs" role="tablist">${tabs.map(tabLink).join("")}</div>
    ${tab === "pr" ? pullRequestsPanel(item) : tab === "history" ? historyPanel(item) : tab === "06-open-questions" ? questionsPanel(item) : stepPanel(item, tab)}`;
  restoreForm(view, keptForm);
  finishPage(view);
}

// A markdown file of the vault in a panel: where it comes from, the FR / EN switch when its French copy exists (else
// `translate`, a button that asks Claude to write it), `action` (run Claude on it again), then the file. A missing
// file says what Claude would write there.
function filePanel(report, { translate, action, missing }) {
  if (!report) return `<section class="row empty-step"><h2>${esc(missing.title)}</h2><p class="muted">${esc(missing.help)}</p>${missing.button}</section>`;
  // An older file may exist in French only: it then comes as the main one, with nothing to switch to or translate.
  const frenchOnly = report.file.endsWith(".fr.md");
  const shown = docLang ?? lang;
  const doc = shown === "fr" && report.fr ? report.fr : report;
  const { fields, body } = frontmatter(doc.markdown);
  const sessions = (fields.sessions || fields.session || "").replace(/[\[\]]/g, "").split(",").filter(id => id.trim()).length;
  const language = report.fr
    ? `<span class="seg" role="group" aria-label="${esc(t("fileLanguage"))}">${["fr", "en"].map(code =>
        `<button data-doclang="${code}" aria-pressed="${code === shown}">${code.toUpperCase()}</button>`).join("")}</span>`
    : frenchOnly ? "" : translate;
  return `<section class="row panel">
    <div class="panel-bar"><span>${[doc.file.split("/").pop(), t("updatedAgo")(ago(fields.updated || doc.updated)), sessions && t("writtenBySessions")(sessions),
        !report.fr && !frenchOnly && t("englishOnly")].filter(Boolean).map(esc).join(" · ")}</span>
      <span class="row-actions">${language}${action || ""}</span></div>
    <div class="markdown" data-vault="${esc(doc.file)}">${markdown(body)}</div></section>`;
}

// A working file of the PBI, with a button that runs Claude on this step again.
function stepPanel(item, step) {
  const claude = (kind, label, cls) =>
    `<button class="${cls}" data-claude="${kind}/${item.id}" data-query="&amp;step=${step}" data-label="${label}">${esc(t(label))}</button>`;
  return filePanel(item.files?.[step], { translate: claude("translate", "claudeTranslate", "dashed"), action: claude("step", "claudeStep", ""),
    missing: { title: t("stepMissing")(t("steps")[step]), help: t("stepHelp")[step], button: claude("step", "claudeStepStart", "primary") } });
}

// Questions asked to the PO or the team: one file each in the vault (rule "Questions" of the workspace CLAUDE.md),
// read from /api/questions on their own (no Azure DevOps call). A question is a draft, then waiting once asked, then
// resolved by an answer or dropped. The Questions view lists them all, the Questions tab of a PBI lists its own, and
// the forms write the files through POST /api/questions/<action>, which answers the new list.
let questions = [], questionForm = null, questionFilter = "waiting";
// Questions unfolded or folded by hand (file -> shown); the others follow the default of their view.
const shownQuestions = new Map();
const questionRank = { waiting: 0, draft: 1, resolved: 2, dropped: 3 };
const questionChannels = ["ado", "teams", "email", "kb", "call", "other"];
const stateOf = q => q.state in questionRank ? q.state : "draft";
const askedTime = q => new Date(q.asked || q.updated).getTime() || 0;
// Waiting ones first, the oldest on top; then the drafts and the closed ones, the last changed on top.
const sortQuestions = list => [...list].sort((a, b) => questionRank[stateOf(a)] - questionRank[stateOf(b)]
  || (stateOf(a) === "waiting" ? askedTime(a) - askedTime(b) : (b.updated ?? "").localeCompare(a.updated ?? "")));
// A date of a question file: with its time when it has one, as written when it is not a date.
const when = value => !value ? "" : isNaN(new Date(value)) ? value : value.includes("T") ? shortDateTime(value) : shortDate(value);
const messageLink = url => /^https?:\/\//.test(url ?? "") ? `<a class="link" href="${esc(url)}" target="_blank" rel="noopener">${esc(t("qOpenMessage"))}</a>` : "";
const questionNumber = q => { const match = /^q(\d+)-/.exec(q.name); return match ? `Q${Number(match[1])}` : q.title; };
const nowLocal = () => { const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset()); return now.toISOString().slice(0, 16); };
const optionsHtml = (values, names, selected) => values.map(value =>
  `<option value="${esc(value)}"${value === selected ? " selected" : ""}>${esc(names[value] ?? value)}</option>`).join("");

async function loadQuestions() {
  try {
    const response = await fetch("/api/questions");
    if (response.ok) setQuestions(await response.json());
  } catch { }
}
function setQuestions(list) {
  questions = list;
  updateQuestionsTab();
  drawQuestions();
}
const drawQuestions = () => { renderQuestions(); renderPbi(); };
// What is typed in an open question form survives a redraw of its view (a refresh, a question unfolded): its values,
// focus and cursor are taken before and put back in the same form after.
function formValues(view) {
  const form = view.querySelector("form.qform");
  const focused = form?.contains(document.activeElement) ? document.activeElement : null;
  return form && { key: form.dataset.qsubmit + form.dataset.file, busy: form.dataset.busy,
    focus: focused && { name: focused.name, start: focused.selectionStart, end: focused.selectionEnd },
    fields: [...form.elements].filter(field => field.name).map(field => ({ name: field.name, type: field.type, value: field.value, checked: field.checked })) };
}
function restoreForm(view, kept) {
  const form = view.querySelector("form.qform");
  if (!kept || !form || form.dataset.qsubmit + form.dataset.file !== kept.key) return;
  kept.fields.forEach(({ name, type, value, checked }) => {
    const field = type === "radio" ? [...form.querySelectorAll(`[name="${name}"]`)].find(radio => radio.value === value) : form.elements[name];
    if (!field) return;
    if (type === "radio" || type === "checkbox") field.checked = checked;
    else field.value = value;
    if (name === "pbi") form.elements.follows.innerHTML = followsOptions(Number(value) || null, "");
    if (name === "askedNow") askedToggle(form, checked);
  });
  if (kept.busy) setBusy(form, true);
  // The field that was being typed in keeps the focus and the cursor.
  const field = kept.focus?.name && form.elements[kept.focus.name];
  if (field?.focus) {
    field.focus({ preventScroll: true });
    try { field.setSelectionRange(kept.focus.start, kept.focus.end); } catch { }
  }
}
const askedToggle = (form, on) => { const fields = form.querySelector("[data-asked-fields]"); fields.hidden = fields.disabled = !on; };
// A form being saved cannot be sent again.
const setBusy = (form, on) => { form.dataset.busy = on ? "1" : ""; form.querySelector("[type=submit]").disabled = on; };
function updateQuestionsTab() {
  const waiting = questions.filter(q => stateOf(q) === "waiting").length;
  document.getElementById("questionsTab").innerHTML = esc(t("tabQuestions")) + (waiting ? pill("TODO", waiting, "small") : "");
}

// One question: its state (and how long it has been waiting), who it was asked to and where, its answers with their
// source and link, then what can be done with it, or the form that was opened on it.
function questionCard(q, showPbi) {
  const state = stateOf(q);
  const chase = state === "waiting" && Date.now() - askedTime(q) > 7 * 864e5;
  const item = lastData?.workItems.find(workItem => workItem.id === q.pbi);
  const related = other => `<a class="link" href="#" data-qshow="${esc(other.file)}" title="${esc(other.title)}">${esc(questionNumber(other))}</a>`;
  const follows = q.follows && questions.find(other => other.pbi === q.pbi && other.name === q.follows);
  const followers = questions.filter(other => other.pbi === q.pbi && other.follows === q.name);
  const meta = [
    showPbi && (!q.pbi ? esc(t("qNoPbi")) : item ? `<a class="link" href="#pbi/${q.pbi}/06-open-questions">#${q.pbi} ${esc(item.title)}</a>` : `#${q.pbi}`),
    state === "draft" && !q.asked ? esc(t("qDraftMeta"))
      : [q.to ? `${esc(t("qAskedTo"))} <b>${esc(q.to)}</b>` : esc(t("qAskedOnly")), esc(t("qChannels")[q.channel] ?? q.channel ?? ""), esc(when(q.asked))].filter(Boolean).join(" · "),
    messageLink(q.link),
    follows && `${esc(t("qFollows"))} ${related(follows)}`,
    followers.length && `${esc(t("qLedTo"))} ${followers.map(related).join(", ")}`,
  ].filter(Boolean).join(" · ");
  // The text of the question shows at once in the tab of its PBI while it is open, and on demand elsewhere.
  const open = shownQuestions.get(q.file) ?? (!showPbi && questionRank[state] < 2);
  const button = (kind, label, cls = "") => `<button class="${cls}" data-qform="${kind}" data-file="${esc(q.file)}">${esc(t(label))}</button>`;
  const setState = (value, label) => `<button class="link" data-qstate="${value}" data-file="${esc(q.file)}">${esc(t(label))}</button>`;
  const toggle = `<button class="link" data-qtoggle="${esc(q.file)}" data-open="${open}">${esc(t(open ? "qHide" : "qShow"))}</button>`;
  const actions = state === "draft" ? `${button("ask", "qIAsked")}<button data-qcopy="${esc(q.file)}">${esc(t("qCopy"))}</button>${toggle}${setState("dropped", "qDrop")}`
    : state === "waiting" ? `${button("answer", "qAnswer", "primary")}${button("decide", "qDecide")}${toggle}${button("new", "qFollowUp", "link")}${setState("dropped", "qDrop")}`
    : `${toggle}${button("new", "qFollowUp", "link")}${setState(q.asked ? "waiting" : "draft", "qReopen")}`;
  const form = questionForm?.file === q.file && questionForm.kind !== "new";
  return `<article class="row pad question ${state}" data-qcard="${esc(q.file)}" data-vault="${esc(q.file)}">
    <div class="row-meta">${pill(state === "waiting" ? "TODO" : state === "resolved" ? "OK" : "", [t("qStates")[state], state === "waiting" && ago(q.asked || q.updated), chase && t("qChase")].filter(Boolean).join(" · "))}<span>${meta}</span></div>
    <h3>${esc(q.title)}</h3>
    ${open && q.question ? `<div class="markdown">${markdown(q.question)}</div>` : ""}
    ${q.answers.map(answer => `<div class="answer"><div class="row-meta"><b>${esc(answer.author)}</b><span>${esc(when(answer.date))}</span>
        ${pill("WAIT", t("qChannels")[answer.source] ?? answer.source, "small")}${messageLink(answer.link)}</div>
      <div class="markdown">${markdown(answer.text)}</div></div>`).join("")}
    ${open && q.notes ? `<div><div class="label">${esc(t("qNotes"))}</div><div class="markdown">${markdown(q.notes)}</div></div>` : ""}
    ${form ? (questionForm.kind === "ask" ? askForm(q) : answerForm(q, questionForm.kind === "decide")) : `<div class="row-actions">${actions}</div>`}</article>`;
}

// The forms. The names already met (people asked, authors of answers) are proposed where a name is typed.
const formHtml = (kind, file, title, fields, submit) => `<form class="qform" data-qsubmit="${kind}" data-file="${esc(file ?? "")}">
    <b>${esc(title)}</b>${fields}
    <datalist id="people">${[...new Set(questions.flatMap(q => [...(q.to ?? "").split(","), ...q.answers.map(answer => answer.author)])
      .map(name => name.trim()).filter(Boolean))].sort().map(name => `<option value="${esc(name)}">`).join("")}</datalist>
    <div class="row-actions"><button class="primary" type="submit">${esc(submit)}</button><button type="button" data-qcancel>${esc(t("qCancel"))}</button><span class="note"></span></div></form>`;
// Who a question was asked to, where, when, and the link of the message (pasted from Teams, Azure DevOps or a mail).
const askedFields = q => `<div class="fields">
    <label>${esc(t("qTo"))}<input name="to" required list="people" autocomplete="off" value="${esc(q?.to ?? "")}"></label>
    <label>${esc(t("qChannel"))}<select name="channel">${optionsHtml(questionChannels, t("qChannels"), q?.channel ?? "teams")}</select></label>
    <label>${esc(t("qAskedOn"))}<input name="asked" type="datetime-local" required value="${nowLocal()}"></label>
    <label>${esc(t("qLink"))}<input name="link" type="url" placeholder="https://" value="${esc(q?.link ?? "")}"></label></div>`;
const askForm = q => formHtml("ask", q.file, t("qIAsked"), askedFields(q), t("qSaveAsk"));

// An answer, or my own decision (source "decision", under the name my last decision was written with).
function answerForm(q, decide) {
  const author = decide ? questions.flatMap(other => other.answers).filter(answer => answer.source === "decision").pop()?.author ?? ""
    : (q.to ?? "").split(",")[0].trim();
  return formHtml("answer", q.file, t(decide ? "qDecide" : "qAnswer"), `<div class="fields">
      <label>${esc(t("qSource"))}<select name="source">${optionsHtml([...questionChannels, "decision"], t("qChannels"), decide ? "decision" : q.channel ?? "teams")}</select></label>
      <label>${esc(t("qAuthor"))}<input name="author" required list="people" autocomplete="off" value="${esc(author)}"></label>
      <label>${esc(t("qAnswerDate"))}<input name="date" type="datetime-local" required value="${nowLocal()}"></label>
      <label>${esc(t("qLink"))}<input name="link" type="url" placeholder="https://"></label></div>
    <label>${esc(t("qAnswerText"))}<textarea name="text" required></textarea></label>
    <div class="row-actions"><span class="muted">${esc(t("qAfter"))}</span>
      <label class="check"><input type="radio" name="state" value="resolved" checked>${esc(t("qResolved"))}</label>
      <label class="check"><input type="radio" name="state" value="waiting">${esc(t("qStillWaiting"))}</label></div>`, t("qSaveAnswer"));
}

// A new question: for one of my PBIs (or one that already has questions) or for none, maybe following another one,
// kept as a draft unless it was already asked.
const followsOptions = (pbi, selected) => `<option value=""></option>` + sortQuestions(questions.filter(q => (q.pbi ?? null) === pbi))
  .map(q => `<option value="${esc(q.name)}"${q.name === selected ? " selected" : ""}>${esc(q.title)}</option>`).join("");
function newQuestionForm({ pbi = null, follows = "" }) {
  const titles = new Map([...questions.filter(q => q.pbi).map(q => [q.pbi, ""]), ...(lastData?.workItems ?? []).map(item => [item.id, item.title])]);
  if (pbi) titles.set(pbi, titles.get(pbi) ?? "");
  return formHtml("create", "", t("qNew"), `<div class="fields">
      <label>${esc(t("qPbi"))}<select name="pbi"><option value="">${esc(t("qNoPbi"))}</option>${[...titles.keys()].sort((a, b) => b - a).map(id =>
        `<option value="${id}"${id === pbi ? " selected" : ""}>#${id} ${esc(titles.get(id))}</option>`).join("")}</select></label>
      <label>${esc(t("qFollowsField"))}<select name="follows">${followsOptions(pbi, follows)}</select></label></div>
    <label>${esc(t("qTitle"))}<input name="title" required autocomplete="off"></label>
    <label>${esc(t("qText"))}<textarea name="question"></textarea></label>
    <label class="check"><input type="checkbox" name="askedNow" data-qasked>${esc(t("qAlreadyAsked"))}</label>
    <fieldset data-asked-fields hidden disabled>${askedFields()}</fieldset>`, t("qSaveNew"));
}

// The Questions view: every question of the vault, the ones waiting for an answer first.
function renderQuestions() {
  if (activeView !== "questions") return;
  const filters = { waiting: ["waiting"], draft: ["draft"], closed: ["resolved", "dropped"] };
  const inFilter = key => questions.filter(q => filters[key].includes(stateOf(q)));
  const waiting = sortQuestions(inFilter("waiting")), shown = sortQuestions(inFilter(questionFilter));
  const view = document.getElementById("questionsView"), kept = formValues(view);
  view.innerHTML = `<div class="head-row">
      <div><h2>${esc(t("qHeadline")(waiting.length))}</h2>
        <div class="muted">${esc(cap([waiting.length && t("qOldest")(ago(waiting[0].asked || waiting[0].updated)), t("qDraftsToAsk")(inFilter("draft").length)].filter(Boolean).join(" · ")))}</div></div>
      <button class="primary" data-qform="new">${esc(t("qNew"))}</button></div>
    <div class="sprints">${Object.keys(filters).map(key => `<button data-qfilter="${key}" aria-pressed="${key === questionFilter}" class="${key === questionFilter ? "on" : ""}">${
      esc(t("qFilters")[key])} · ${inFilter(key).length}</button>`).join("")}</div>
    ${questionForm?.kind === "new" ? newQuestionForm(questionForm) : ""}
    <div class="list">${shown.map(q => questionCard(q, true)).join("") || `<div class="empty">${esc(t("qEmptyFilter"))}</div>`}</div>`;
  view.querySelectorAll(".markdown a").forEach(a => a.target = "_blank");
  restoreForm(view, kept);
}

// The Questions tab of a PBI: its questions, a new one, or Claude to draft them (the step 06-open-questions).
function questionsPanel(item) {
  const list = sortQuestions(questions.filter(q => q.pbi === item.id));
  const claude = `<button data-claude="step/${item.id}" data-query="&amp;step=06-open-questions" data-label="claudeQuestions">${esc(t("claudeQuestions"))}</button>`;
  const add = `<button class="primary" data-qform="new" data-pbi="${item.id}">${esc(t("qNew"))}</button>`;
  const form = questionForm?.kind === "new" ? newQuestionForm(questionForm) : "";
  // A file with no question file next to it is in the older format, its questions inline: shown as the file it is.
  const index = item.files?.["06-open-questions"];
  if (!list.length && index) return `<div class="head-row"><span></span><span class="row-actions">${add}</span></div>${form}${stepPanel(item, "06-open-questions")}`;
  if (!list.length) return `${form}<section class="row empty-step"><h2>${esc(t("qNone"))}</h2>
    <p class="muted">${esc(t("stepHelp")["06-open-questions"])}</p><div class="row-actions">${add}${claude}</div></section>`;
  const counts = Object.keys(questionRank).map(state => [state, list.filter(q => stateOf(q) === state).length]).filter(([, count]) => count)
    .map(([state, count]) => t("qCounts")[state](count)).join(" · ");
  return `<div class="head-row"><span class="muted">${esc(counts)}${index ? ` · ${docLink(`pbi:${item.id}:06-open-questions`, t("qReadIndex"))}` : ""}</span><span class="row-actions">${claude}${add}</span></div>
    ${form}<div class="list">${list.map(q => questionCard(q, false)).join("")}</div>`;
}

async function postQuestion(action, body, form) {
  try {
    const response = await fetch(`/api/questions/${action}`, { method: "POST", headers: { "X-Dashboard": "1", "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || response.statusText);
    questionForm = null;
    dropForms();
    document.getElementById("error").style.display = "none";
    setQuestions(data);
  } catch (e) {
    if (form?.isConnected) setBusy(form, false);
    const note = form?.querySelector(".note") ?? document.getElementById("error");
    note.textContent = t("qSaveFailed")(e.message);
    note.style.display = "block";
  }
}

// A form that is opened or closed starts from its own values, not from what the form it replaces held.
const dropForms = () => document.querySelectorAll("form.qform").forEach(form => form.remove());
// Clicks on the question cards and forms (called by the page's click listener).
function questionClick(e) {
  const pick = name => e.target.closest(`[data-${name}]`);
  const formButton = pick("qform"), toggle = pick("qtoggle"), show = pick("qshow"), filter = pick("qfilter"), state = pick("qstate"), copy = pick("qcopy");
  if (formButton) {
    // "New" from a card is a follow-up of its question; from the tab of a PBI it is a question of that PBI.
    const q = questions.find(other => other.file === formButton.dataset.file);
    questionForm = formButton.dataset.qform === "new"
      ? { kind: "new", pbi: q?.pbi ?? (Number(formButton.dataset.pbi) || null), follows: q?.name ?? "" }
      : { kind: formButton.dataset.qform, file: q.file };
    dropForms();
    drawQuestions();
    [...document.querySelectorAll(".qform")].find(form => form.offsetParent)?.scrollIntoView({ block: "center" });
  }
  if (pick("qcancel")) { questionForm = null; dropForms(); drawQuestions(); }
  if (toggle) { shownQuestions.set(toggle.dataset.qtoggle, toggle.dataset.open !== "true"); drawQuestions(); }
  if (show) {
    // The question another one follows or led to: unfolded, under the filter that holds it, and scrolled to.
    e.preventDefault();
    const q = questions.find(other => other.file === show.dataset.qshow);
    shownQuestions.set(q.file, true);
    questionFilter = { waiting: "waiting", draft: "draft" }[stateOf(q)] ?? "closed";
    drawQuestions();
    [...document.querySelectorAll("[data-qcard]")].find(card => card.dataset.qcard === q.file && card.offsetParent)?.scrollIntoView();
  }
  if (filter) { questionFilter = filter.dataset.qfilter; renderQuestions(); }
  if (state) postQuestion("state", { file: state.dataset.file, state: state.dataset.qstate });
  if (copy) {
    const q = questions.find(other => other.file === copy.dataset.qcopy);
    // A question without text is its title; without the clipboard (a page not on localhost) the button says so.
    const done = label => { copy.textContent = t(label); setTimeout(() => copy.textContent = t("qCopy"), 2000); };
    (navigator.clipboard?.writeText(q.question || q.title) ?? Promise.reject()).then(() => done("qCopied"), () => done("qCopyFailed"));
  }
}
document.addEventListener("submit", e => {
  const form = e.target.closest("form.qform");
  if (!form) return;
  e.preventDefault();
  if (form.dataset.busy) return;
  const body = Object.fromEntries(new FormData(form));
  setBusy(form, true);
  if (form.dataset.file) body.file = form.dataset.file;
  if (form.dataset.qsubmit === "create") {
    body.pbi = Number(body.pbi) || null;
    body.pbiTitle = lastData?.workItems.find(item => item.id === body.pbi)?.title ?? "";
    body.state = body.askedNow ? "waiting" : "draft";
  }
  postQuestion(form.dataset.qsubmit, body, form);
});
document.addEventListener("change", e => {
  const form = e.target.closest("form.qform");
  if (!form) return;
  // "Already asked" opens the fields that say to whom and where; another PBI offers its own questions to follow.
  if (e.target.matches("[data-qasked]")) askedToggle(form, e.target.checked);
  if (e.target.name === "pbi") form.elements.follows.innerHTML = followsOptions(Number(e.target.value) || null, "");
});

// Search (#search/<words>): the words typed in the header, looked for in Azure DevOps (work items and pull requests
// of the project) and in the markdown files of the vault, by GET /api/search. A number alone, "#1201" or "!4215",
// opens the page of that PBI or pull request when it is one of mine.
let searchQuery = "", searchData = null, searchLoading = false, searchScope = "all", searchClosed = false, searchFolder = "";

async function loadSearch(query) {
  if (query !== searchQuery) { searchData = null; searchFolder = ""; }
  searchQuery = query;
  document.getElementById("searchInput").value = query;
  if (searchData || searchLoading) return renderSearch();
  searchLoading = true;
  renderSearch();
  const asked = `${query}\n${searchClosed}`;
  let data;
  try {
    const response = await fetch(`/api/search?q=${encodeURIComponent(query)}${searchClosed ? "&closed=1" : ""}`);
    data = await response.json();
    if (!response.ok) throw new Error(data.detail || response.statusText);
  } catch (e) {
    data = { words: [], workItems: [], pullRequests: [], vault: [], error: e.message };
  }
  searchLoading = false;
  // Another search was asked meanwhile: this answer is not the one to show.
  if (asked !== `${searchQuery}\n${searchClosed}`) return loadSearch(searchQuery);
  searchData = data;
  renderSearch();
}

// A text with the searched words marked. The text is cut at the words first and each piece escaped after, so a word
// never matches inside an escaped character ("39" in "&#39;").
function highlight(text, words) {
  const found = words.filter(Boolean).map(word => word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!found.length) return esc(text);
  return String(text).split(new RegExp(`(${found.join("|")})`, "gi")).map((part, index) => index % 2 ? `<mark>${esc(part)}</mark>` : esc(part)).join("");
}

function renderSearch() {
  if (activeView !== "search") return;
  const view = document.getElementById("searchView");
  const head = `<div class="head-row"><h2>${esc(t("searchTitle")(searchQuery))}</h2>${searchLoading ? '<span class="spinner"></span>' : ""}</div>`;
  if (!searchData) { view.innerHTML = head; return; }
  const { words, workItems, pullRequests, vault } = searchData;
  const mark = text => highlight(text ?? "", words);
  const ado = workItems.length + pullRequests.length;
  const chip = (attribute, value, label, on) => `<button ${attribute}="${esc(value)}" aria-pressed="${on}" class="${on ? "on" : ""}">${esc(label)}</button>`;
  const where = result => [t("searchWhere")[result.where], result.excerpt && `« ${mark(result.excerpt)} »`].filter(Boolean).join(" : ");
  const adoLink = url => `<a class="link" href="${esc(url)}" target="_blank">${esc(t("openInAdo"))}</a>`;
  const row = (pillHtml, meta, title, href, line, actions) => `<article class="row"><div class="row-main"><div class="row-text">
      <div class="row-meta">${pillHtml}<span>${meta}</span></div>
      <h3>${href ? `<a href="${href}">${title}</a>` : title}</h3>
      ${line ? `<div class="row-line">${line}</div>` : ""}</div>
    <div class="row-actions">${actions}</div></div></article>`;

  // One of my open PBIs opens its page here; another PBI or bug can be reviewed with Claude (the review is about the
  // pull requests of a PBI, so not a Feature or a Test Suite); any other opens in Azure DevOps.
  const itemRow = item => {
    const mine = lastData?.workItems.some(workItem => workItem.id === item.id);
    return row(pill(mine ? "WAIT" : "", mine ? t("searchMine")(item.type) : item.type),
      [`#${item.id}`, item.iteration, item.state, item.assignedTo].filter(Boolean).map(esc).join(" · "),
      mark(item.title), mine ? `#pbi/${item.id}` : "", where(item),
      mine ? `<a class="btn" href="#pbi/${item.id}">${esc(t("details"))}</a>`
        : `${/^(product backlog item|bug)$/i.test(item.type) ? claudeButton("pbi-review", item.id, "claudeReview") : ""}${adoLink(item.url)}`);
  };
  // A pull request the dashboard already shows opens its page; another active one can be reviewed with Claude, which
  // adds me to its reviewers.
  const known = new Set([...(lastData?.reviews ?? []), ...(lastData?.workItems ?? []).flatMap(item => item.pullRequests)].map(pr => pr.id));
  const prRow = pr => {
    const state = pr.status === "completed" ? t("merged") : pr.status === "abandoned" ? t("abandoned") : "";
    return row(pill(pr.isMine ? "WAIT" : "", pr.isMine ? t("searchMine")("PR") : "PR"),
      [`PR ${pr.id}`, `${pr.repository} → ${pr.targetBranch}`, pr.author, state || t("since")(ago(pr.createdDate))].filter(Boolean).map(esc).join(" · "),
      mark(pr.title), known.has(pr.id) ? `#pr/${pr.id}` : "", where(pr),
      known.has(pr.id) ? `<a class="btn" href="#pr/${pr.id}">${esc(t("details"))}</a>`
        : `${pr.status === "active" && !pr.isMine ? `<button data-claude="review/${pr.id}" data-query="&amp;addReviewer=1" data-label="claudeReview">${esc(t("claudeReview"))}</button>` : ""}${adoLink(pr.url)}`);
  };
  // A file of the vault opens in the reader; a question says its state.
  const folders = [...new Set(vault.map(file => file.folder))].sort();
  const fileRow = file => {
    const question = file.question && [t("qStates")[file.question.state] ?? file.question.state, file.question.to && `${t("qAskedTo")} ${file.question.to}`].filter(Boolean).join(" · ");
    return `<article class="row pad result"><div class="row-meta">${pill(file.question?.state === "waiting" ? "TODO" : file.pbi ? "WAIT" : "", file.pbi ? `PBI #${file.pbi}` : file.folder || "Vault")}
        <span>${[file.file.replaceAll("/", " / "), t("updatedAgo")(ago(file.updated)), file.count > 0 && t("searchPassages")(file.count), question].filter(Boolean).map(esc).join(" · ")}</span></div>
      <h3><a href="/${esc(file.file.split("/").map(encodeURIComponent).join("/"))}">${mark(file.title)}</a></h3>
      ${file.passages.map(passage => `<div class="row-line">${mark(passage)}</div>`).join("")}</article>`;
  };
  const shownFiles = vault.filter(file => !searchFolder || file.folder === searchFolder);

  view.innerHTML = `${head}
    <div class="sprints">${chip("data-search-scope", "all", `${t("searchAll")} · ${ado + vault.length}`, searchScope === "all")}${
      chip("data-search-scope", "ado", `Azure DevOps · ${ado}`, searchScope === "ado")}${chip("data-search-scope", "vault", `Vault · ${vault.length}`, searchScope === "vault")}</div>
    ${searchData.error ? `<div class="bad">${esc(t("refreshFailed")(searchData.error))}</div>` : ""}
    ${searchScope === "vault" ? "" : `<section class="group">
      <div class="head-row"><h2>Azure DevOps <span class="count">· ${ado}</span></h2>
        <div class="sprints">${chip("data-search-closed", "", t("searchClosed"), searchClosed)}</div></div>
      ${searchData.adoError ? `<div class="bad">${esc(t("refreshFailed")(searchData.adoError))}</div>` : ""}
      <div class="list">${[...workItems.map(itemRow), ...pullRequests.map(prRow)].join("") || `<div class="empty">${esc(t("searchNoAdo"))}</div>`}</div></section>`}
    ${searchScope === "ado" ? "" : `<section class="group">
      <div class="head-row"><h2>Vault <span class="count">· ${vault.length}</span></h2>
        ${folders.length > 1 ? `<div class="sprints">${chip("data-search-folder", "", t("searchAllFolders"), !searchFolder)}${
          folders.map(folder => chip("data-search-folder", folder, `${folder || "Vault"} · ${vault.filter(file => file.folder === folder).length}`, searchFolder === folder)).join("")}</div>` : ""}</div>
      <div class="list" data-vault="">${shownFiles.map(fileRow).join("") || `<div class="empty">${esc(t("searchNoVault"))}</div>`}</div></section>`}`;
}

// The search box of the header: Enter searches; "/" anywhere outside a field goes to it.
document.getElementById("searchForm").onsubmit = event => {
  event.preventDefault();
  const query = document.getElementById("searchInput").value.trim();
  if (!query) return;
  const number = /^(#|!|pr\s*)?(\d+)$/i.exec(query), id = number && Number(number[2]);
  const pullRequest = number && number[1] && number[1] !== "#";
  if (id && !pullRequest && lastData?.workItems.some(item => item.id === id)) { location.hash = `#pbi/${id}`; return; }
  if (id && pullRequest && [...lastData?.reviews ?? [], ...(lastData?.workItems ?? []).flatMap(item => item.pullRequests)].some(pr => pr.id === id)) { location.hash = `#pr/${id}`; return; }
  searchData = null;
  if (location.hash === `#search/${encodeURIComponent(query)}`) loadSearch(query);
  else location.hash = `#search/${encodeURIComponent(query)}`;
};
document.addEventListener("keydown", event => {
  if (event.key !== "/" || event.ctrlKey || event.metaKey || event.altKey || event.target.closest?.("input, textarea, select, [contenteditable]")
    || document.getElementById("reviewDialog").open) return;
  event.preventDefault();
  document.getElementById("searchInput").select();
});
// Clicks on the chips of the results (called by the page's click listener).
function searchClick(e) {
  const scope = e.target.closest("[data-search-scope]"), folder = e.target.closest("[data-search-folder]");
  if (scope) { searchScope = scope.dataset.searchScope; renderSearch(); }
  if (folder) { searchFolder = folder.dataset.searchFolder; renderSearch(); }
  if (e.target.closest("[data-search-closed]")) { searchClosed = !searchClosed; searchData = null; loadSearch(searchQuery); }
}

// The page of one pull request (#pr/<id>/<tab>), one I review or one of my PBIs: what it asks, its signals, votes,
// work items and description, then its open comment threads whole, my review and the analysis of its threads.
let prRoute = null;

function renderPr() {
  if (!prRoute) return;
  const view = document.getElementById("prView");
  if (!lastData) { view.innerHTML = pagePlaceholder(); return; }
  const pr = [...lastData.reviews, ...lastData.workItems.flatMap(item => item.pullRequests)].find(candidate => candidate.id === prRoute.id);
  if (!pr) { view.innerHTML = `<div>${backLink()}</div><div class="empty">${esc(t("prNotFound")(prRoute.id))}</div>`; return; }

  const [status, hint] = prAction(pr);
  const active = pr.status === "active";
  const tabs = ["threads", "review", "analysis"];
  const tab = tabs.includes(prRoute.tab) ? prRoute.tab : pr.openThreads > 0 || !pr.review ? "threads" : "review";
  const reports = { review: pr.review, analysis: pr.threadsReport };
  const tabLink = name => `<a href="#pr/${pr.id}/${name}" role="tab" aria-selected="${name === tab}"
      class="${name === tab ? "on" : ""} ${name in reports && !reports[name] ? "missing" : ""}">${esc(t("prTabs")[name])}${
      name === "threads" && pr.openThreads > 0 ? pill("TODO", t("openCount")(pr.openThreads), "small") : ""}</a>`;
  // Its work items: the ones the server linked (a PR I review), else my PBIs that carry it. Mine open their page.
  const mine = new Set(lastData.workItems.map(item => item.id));
  const items = (pr.workItems ?? lastData.workItems.filter(item => item.pullRequests.some(other => other.id === pr.id)))
    .map(w => `${orderPill(w.backlogOrder, w.iteration)} <a href="${mine.has(w.id) ? `#pbi/${w.id}` : `${esc(w.url)}" target="_blank`}">#${w.id}</a> ${esc(w.state)}`).join(" · ");
  const resolved = (pr.totalThreads ?? 0) - (pr.openThreads ?? 0);
  const review = cls => claudeButton("review", pr.id, "claudeReview", "", cls);
  // A review is for an active pull request of someone else: not my own, not a merged or abandoned one.
  const canReview = active && !pr.isMine;
  const panel = tab === "review"
    ? filePanel(pr.review, { translate: claudeButton("review-translate", pr.id, "claudeTranslate", "", "dashed"),
        action: resumeReviewButton(pr, "") || (canReview && review("")),
        missing: { title: t("reviewMissing"), help: canReview ? t("reviewHelp") : "", button: canReview ? review("primary") : "" } })
    : tab === "analysis"
    ? filePanel(pr.threadsReport, { translate: claudeButton("threads-translate", pr.id, "claudeTranslate", "", "dashed"),
        action: resumeThreadsButton(pr, "") || threadsButton(pr, ""),
        missing: { title: t("analysisMissing"), help: t("analysisHelp"), button: threadsButton(pr, "primary") || "" } })
    : `<div class="list">${(pr.threads ?? []).map(thread => `<section class="row pad">${conversationHtml(thread)}</section>`).join("")
        || `<div class="empty">${esc(t("noOpenThread"))}</div>`}
        ${resolved > 0 ? `<section class="row pad muted">${esc(t("resolvedThreads")(resolved))}</section>` : ""}</div>`;

  view.innerHTML = `<div class="links">${backLink()}<a href="${esc(pr.url)}" target="_blank" style="margin-left:auto">${esc(t("openInAdo"))}</a></div>
    <div class="pbi-head">
      <div class="row-meta">${pill(status, cap(hint))}
        <span>${[`PR ${pr.id}`, `${pr.repository} → ${pr.targetBranch}`, pr.author, t("since")(ago(pr.createdDate))].filter(Boolean).map(esc).join(" · ")}</span></div>
      <h1>${esc(pr.title)}</h1>
      ${active ? `<div class="row-line">${signals(pr)}</div><div class="muted">${esc(t("votesLabel"))} ${votesText(pr)}</div>` : ""}
      <div class="muted">${items ? `${esc(t("linkedItems"))} ${items}` : esc(t("noWorkItem"))}</div>
    </div>
    ${pr.description ? `<div class="desc-block"><div class="label">${esc(t("description"))}</div>
      <div class="desc markdown ${descOpen ? "open" : ""}">${markdown(pr.description)}</div>
      <div><button class="link" data-desc-toggle aria-expanded="${descOpen}">${esc(t(descOpen ? "descLess" : "descMore"))}</button></div></div>` : ""}
    ${active ? `<div class="row-actions">${pr.isMine ? "" : review(status === "TODO" ? "primary" : "")}${resumeReviewButton(pr, "") || ""}
      ${threadsButton(pr, pr.isMine ? "primary" : "") || ""}${resumeThreadsButton(pr, "") || ""}</div>` : ""}
    <div class="steptabs" role="tablist">${tabs.map(tabLink).join("")}</div>
    ${panel}`;
  finishPage(view);
}

// After a PBI or PR page is drawn: links of the markdown open a new tab, and "show more" goes away when the folded
// description already shows whole.
function finishPage(view) {
  view.querySelectorAll(".markdown a").forEach(a => a.target = "_blank");
  const desc = view.querySelector(".desc");
  if (desc && !descOpen && desc.scrollHeight <= desc.clientHeight + 2) view.querySelector("[data-desc-toggle]").hidden = true;
}
// A PBI or PR page before the first data: the way back, and a spinner while the data loads (if the load failed, the
// error banner says why).
const pagePlaceholder = () => `<div>${backLink()}</div>${loading ? `<div class="row placeholder"><span class="spinner"></span>${esc(t("loading"))}</div>` : ""}`;
const backLink = () => `<a class="link" href="#"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>${esc(t("tabToday"))}</a>`;

// The pull requests of the PBI: what each asks, then its open comment threads whole. Resolved threads are only counted.
function pullRequestsPanel(item) {
  return `<div class="list">${item.pullRequests.map(pr => {

    return `<section class="row ${active ? "" : "dim"}"><div class="row-main"><div class="row-text">
          <div class="row-meta">${pill(status, cap(hint))}<span>PR ${pr.id} · ${esc(pr.repository)}${active ? ` → ${esc(pr.targetBranch)} · ${esc(t("since")(ago(pr.createdDate)))}` : ""}</span></div>
          <h3><a href="#pr/${pr.id}">${esc(pr.title)}</a></h3>
          ${active ? `<div class="row-line">${signals(pr)}</div><div class="muted">${esc(t("votesLabel"))} ${votesText(pr)}</div>` : ""}</div>
        <div class="row-actions">${threadsButton(pr, "primary") || ""}${resumeThreadsButton(pr, "") || ""}<a class="btn" href="#pr/${pr.id}">${esc(t("details"))}</a></div></div></section>
      ${(pr.threads ?? []).map(thread => `<section class="row pad">${conversationHtml(thread)}</section>`).join("")}

function historyPanel(item) {
  const text = event => ({
    created: () => t("evCreated")(event.to),
    state: () => t("evState")(event.from ?? "?", event.to),
    sprint: () => t("evSprint")(event.from ?? "-", event.to ?? "-"),
    assigned: () => t("evAssigned")(event.to),
    prCreated: () => t("evPrCreated")(event.pr),
    prMerged: () => t("evPrMerged")(event.pr),
    prAbandoned: () => t("evPrAbandoned")(event.pr),
    session: () => t("evSession"),
  })[event.type]();
  const events = historyEvents(item);
  if (!events.length) return `<div class="empty">${esc(t("noHistory"))}</div>`;
  return `<section class="row timeline">${events.map(event => `<span class="when">${shortDateTime(event.date)}</span>
    <span>${["state", "created"].includes(event.type) ? `<b>${esc(text(event))}</b>` : esc(text(event))}${event.by ? ` · ${esc(event.by)}` : ""}</span>`).join("")}</section>`;
}

// Tab icon and title: a checklist, with a badge of the rows to do when there are some ("(3) Today").

    + badge + "</svg>";
  document.getElementById("favicon").href = `data:image/svg+xml,${encodeURIComponent(svg)}`;
  document.title = (todoCount ? `(${label}) ` : "") + t("title");
}

// Static texts (data-i18n, data-i18n-title) and the date in the header.
function translatePage() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(element => element.textContent = t(element.dataset.i18n));
  document.querySelectorAll("[data-i18n-title]").forEach(element => element.title = element.ariaLabel = t(element.dataset.i18nTitle));
  document.querySelectorAll("[data-i18n-placeholder]").forEach(element => element.placeholder = element.ariaLabel = t(element.dataset.i18nPlaceholder));
  updateReviewPlaceholder();
  updateDailyTab();
  updateQuestionsTab();
  updateTabIcon();
  document.getElementById("today").textContent = cap(new Date().toLocaleDateString(t("locale"), { weekday: "long", day: "numeric", month: "long" }));
  document.getElementById("lang").value = lang;
}

async function load() {
  if (loading) return;
  loading = true;
  loadQuestions();
  const main = document.querySelector("main");
  main.classList.add("loading");
  document.getElementById("updated").innerHTML = `<span class="spinner"></span> ${esc(t("updating"))}`;
  const error = document.getElementById("error");
  try {
    const response = await fetch("/api/today");
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || response.statusText);
    lastData = data;
    render();
    document.getElementById("updated").dataset.at = data.generatedAt;
    error.style.display = "none";
  } catch (e) {
    error.textContent = t("refreshFailed")(e.message);
    error.style.display = "block";
  } finally {
    loading = false;
    main.classList.remove("loading");
    // A first load that failed leaves an open PBI or PR page without data: stop its spinner.
    if (!lastData) { renderPbi(); renderPr(); }
    nextRefresh = Date.now() + refreshSeconds * 1000;
  }
}

function tick() {
  const updated = document.getElementById("updated");
  const at = updated.dataset.at ? new Date(updated.dataset.at).toLocaleTimeString(t("locale"), { hour: "2-digit", minute: "2-digit" }) : "-";
  if (!loading) updated.textContent = t("updated")(at);
  if (!loading && Date.now() >= nextRefresh) load();
}

document.getElementById("lang").onchange = event => {
  lang = event.target.value;
  docLang = null;
  try { localStorage.setItem("dashboard.lang", lang); } catch { }
  translatePage();
  render();
  if (!loading) tick();
};
document.getElementById("refresh").onclick = () => {
  if (activeView === "daily") return loadDaily(true);
  // On the Search view, the search shown runs again too.
  if (activeView === "search") { searchData = null; loadSearch(searchQuery); }
  load();
};

// Daily tab: what I did on the previous working day (Friday on a Monday), from /api/daily, for the daily meeting.
// The arrows move one working day; a day is loaded once, the refresh button reloads it.
let activeView = "today", dailyDay = null, dailyData = null;
const isoDay = date => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
function stepWorkingDay(date, step) {
  const next = new Date(date);
  do next.setDate(next.getDate() + step); while (next.getDay() === 0 || next.getDay() === 6);
  return next;
}
const dayLabel = date => cap(date.toLocaleDateString(t("locale"), { weekday: "long", day: "numeric", month: "long" }));

// The tab says "Yesterday", or the day's name when the previous working day is further back (Friday on a Monday).
function updateDailyTab() {
  const previous = stepWorkingDay(new Date(), -1);
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const name = isoDay(previous) === isoDay(yesterday) ? t("yesterday") : cap(previous.toLocaleDateString(t("locale"), { weekday: "long" }));
  document.getElementById("dailyTab").textContent = t("dailyTab")(name);
  if (dailyDay) renderDaily();
}

async function loadDaily(force = false) {
  dailyDay ??= stepWorkingDay(new Date(), -1);
  if (!force && dailyData?.day === isoDay(dailyDay)) return renderDaily();
  renderDaily();
  document.getElementById("dailySpinner").hidden = false;
  try {
    const response = await fetch(`/api/daily?day=${isoDay(dailyDay)}`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || response.statusText);
    dailyData = data;
    document.getElementById("error").style.display = "none";
  } catch (e) {
    const error = document.getElementById("error");
    error.textContent = t("refreshFailed")(e.message);
    error.style.display = "block";
  } finally {
    document.getElementById("dailySpinner").hidden = true;
  }
  renderDaily();
}

// One card per work item or pull request. A pull request of mine goes into the card of its work item when that item
// has one that day, so a task reads in one place.
function dailyGroups() {
  const groups = dailyData.groups.map(group => ({ ...group, events: [...group.events] }));
  const items = new Map(groups.filter(group => group.type !== "pr").map(group => [group.id, group]));
  return groups.filter(group => {
    const target = group.type === "pr" && group.isMine && (group.workItems ?? []).map(w => items.get(w.id)).find(Boolean);
    if (!target) return true;
    target.events.push(...group.events.map(event => ({ ...event, pr: group.id })));
    target.events.sort((a, b) => new Date(a.time) - new Date(b.time));
    (target.pullRequests ??= []).push(group.id);
    return false;
  });
}

function renderDaily() {
  document.getElementById("dailyTitle").textContent = dayLabel(dailyDay);
  showSummary();
  const container = document.getElementById("daily"), total = document.getElementById("dailyCount");
  total.textContent = "";
  if (!dailyData || dailyData.day !== isoDay(dailyDay)) { container.innerHTML = ""; return; }
  if (!dailyData.groups.length) { container.innerHTML = `<div class="empty">${esc(t("dailyEmpty"))}</div>`; return; }
  const groups = dailyGroups();
  total.textContent = t("dailyTotal")(groups.length, groups.reduce((sum, group) => sum + group.events.length, 0));
  const text = event => (event.kind === "vote" ? t("dailyVotes")[event.text] ?? event.text : event.text) + (event.pr ? ` · PR ${event.pr}` : "");
  const meta = group => group.type === "pr"
    ? [`<a href="${esc(group.url ?? "#")}" target="_blank">PR ${group.id}</a>`, group.author && esc(group.isMine ? t("myPr") : t("prBy")(group.author)),
       group.workItems?.length && `${esc(t("forItems"))} ${group.workItems.map(w => `${orderPill(w.backlogOrder, w.iteration)} #${w.id}`).join(", ")}`]
    : [`<a href="${esc(group.url ?? "#")}" target="_blank">#${group.id}</a>`, esc(group.iteration), group.pullRequests && esc(t("withMyPr")(group.pullRequests.join(", ")))];
  container.innerHTML = groups.map(group => `<article class="row day-card">
      <div class="row-text"><div class="row-meta">${orderPill(group.backlogOrder, group.iteration)}<span>${meta(group).filter(Boolean).join(" · ")}</span></div>
        <h3>${esc(group.title ?? "")}</h3></div>
      <div class="events">${group.events.map(event => `<span class="when">${new Date(event.time).toLocaleTimeString(t("locale"), { hour: "2-digit", minute: "2-digit" })}</span>
        <span><b>${esc(t("dailyKinds")[event.kind] ?? event.kind)}</b> ${esc(text(event))}</span>`).join("")}</div>
    </article>`).join("");
}

// The views share the page: Today, the daily (#daily), one PBI (#pbi/<id>/<tab>) and one pull request
// (#pr/<id>/<tab>). The address keeps the view, so a reload and the browser's back button work.
let shownPage = "", listScroll = 0;
function route() {
  const [name, id, tab] = location.hash.slice(1).split("/");
  const view = ["daily", "questions"].includes(name) || (name === "search" && id) ? name : ["pbi", "pr"].includes(name) && Number(id) ? name : "today";
  // Another PBI or pull request starts folded, from its top; a tab of the same one stays where it is. Leaving the
  // list for such a page keeps the place in the list, to come back to it.
  const isPage = name => name === "pbi" || name === "pr";
  const changed = shownPage !== `${view}/${id}`, backToList = isPage(activeView) && !isPage(view);
  if (isPage(view) && !isPage(activeView)) listScroll = window.scrollY;
  if (changed) descOpen = false;
  shownPage = `${view}/${id}`;
  activeView = view;
  pbiRoute = view === "pbi" ? { id: Number(id), tab } : null;
  prRoute = view === "pr" ? { id: Number(id), tab } : null;
  document.querySelectorAll(".tabs a").forEach(link => link.classList.toggle("on", link.dataset.tab === view));
  ["today", "daily", "questions", "search", "pbi", "pr"].forEach(key => document.getElementById(`${key}View`).hidden = key !== view);
  if (view === "daily") loadDaily();
  if (view === "search") { let words = id; try { words = decodeURIComponent(id); } catch { } loadSearch(words); }
  questionForm = null;
  renderQuestions();
  renderPbi();
  renderPr();
  if (changed && isPage(view)) window.scrollTo(0, 0);
  if (backToList) window.scrollTo(0, listScroll);
}
window.onhashchange = route;

// AI summary of the shown day (POST /api/daily-summary, claude -p on the server), kept per day and language.
const summaries = new Map();
function showSummary() {
  const summary = dailyDay && summaries.get(`${isoDay(dailyDay)}:${lang}`);
  document.getElementById("dailySummary").innerHTML = summary ? `<div class="markdown">${markdown(summary)}</div>` : `<div class="muted">${esc(t("aiSummaryHint"))}</div>`;
  document.getElementById("dailySummaryButton").textContent = t(summary ? "aiSummaryAgain" : "aiSummary");
}
document.getElementById("dailySummaryButton").onclick = async event => {
  const button = event.currentTarget, box = document.getElementById("dailySummary"), key = `${isoDay(dailyDay)}:${lang}`;
  button.disabled = true;
  box.innerHTML = `<div class="muted"><span class="spinner"></span> ${esc(t("aiSummaryRunning"))}</div>`;
  try {
    const response = await fetch(`/api/daily-summary?day=${isoDay(dailyDay)}&lang=${lang}`, { method: "POST", headers: { "X-Dashboard": "1" } });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || response.statusText);
    summaries.set(key, data.summary);
    showSummary();
  } catch (e) {
    box.innerHTML = `<div class="bad">${esc(t("aiSummaryFailed")(e.message))}</div>`;
  } finally {
    button.disabled = false;
  }
};
document.querySelectorAll("[data-day-step]").forEach(button => button.onclick = () => {
  dailyDay = stepWorkingDay(dailyDay, Number(button.dataset.dayStep));
  loadDaily();
});
// Review of any PBI or pull request typed in the box, picked by the PBI / PR selector. "#249499" means a PBI and
// "!55769" or "PR 55769" a pull request, whatever the selector says. Anything else is refused before calling the server.
const reviewKind = () => document.getElementById("reviewKind").value;
const updateReviewPlaceholder = () =>
  document.getElementById("pbiReviewId").placeholder = t(reviewKind() === "pr" ? "prReviewPlaceholder" : "pbiReviewPlaceholder");
const clearReviewError = () => {
  document.getElementById("pbiReviewId").classList.remove("invalid");
  const note = document.getElementById("pbiReviewError");
  note.textContent = note.title = "";
  note.classList.remove("ok");
};
document.getElementById("pbiReview").onsubmit = event => {
  event.preventDefault();
  const input = document.getElementById("pbiReviewId");
  let value = input.value.trim(), kind = reviewKind();
  if (/^#/.test(value)) { kind = "pbi"; value = value.slice(1); }
  else if (/^(!|pr\s*)/i.test(value)) { kind = "pr"; value = value.replace(/^(!|pr\s*)/i, ""); }
  document.getElementById("reviewKind").value = kind;
  const valid = /^\d{1,9}$/.test(value) && Number(value) > 0;
  clearReviewError();
  input.classList.toggle("invalid", !valid);
  document.getElementById("pbiReviewError").textContent = valid ? "" : t(kind === "pr" ? "prReviewInvalid" : "pbiReviewInvalid");
  const button = document.getElementById("pbiReviewButton");
  if (!valid || button.disabled) return;
  if (kind !== "pr") { openClaude(button, `pbi-review/${Number(value)}`); return; }
  // A typed PR: the server first adds me as an optional reviewer, then the PR shows in my code reviews.
  openClaude(button, `review/${Number(value)}`, "&addReviewer=1").then(result => {
    const note = document.getElementById("pbiReviewError");
    note.classList.toggle("ok", result?.reviewer !== "failed");
    note.textContent = result?.reviewer ? t("reviewerOutcome")[result.reviewer] : "";
    if (result?.reviewer === "failed") note.title = result.detail ?? "";
    if (result?.reviewer === "added") load();
  });
};
document.getElementById("pbiReviewId").oninput = clearReviewError;
document.getElementById("reviewKind").onchange = () => { clearReviewError(); updateReviewPlaceholder(); };
document.addEventListener("click", e => {
  openVaultLink(e);
  const doc = e.target.closest("[data-doc]");
  if (doc) openDocument(doc.dataset.doc);
  const claude = e.target.closest("[data-claude]");
  if (claude && !claude.disabled) openClaude(claude);
  const sprint = e.target.closest("[data-sprint]");
  if (sprint) toggleSprint(sprint.dataset.sprint);
  const fileLanguage = e.target.closest("[data-doclang]");
  if (fileLanguage) { docLang = fileLanguage.dataset.doclang; renderPbi(); renderPr(); }
  if (e.target.closest("[data-desc-toggle]")) { descOpen = !descOpen; renderPbi(); renderPr(); }
  questionClick(e);
  searchClick(e);
});
document.getElementById("reviewClose").onclick = () => document.getElementById("reviewDialog").close();
document.getElementById("reviewDialog").onclose = () => readerTrail.length = 0;
document.getElementById("reviewBack").onclick = () => { readerTrail.pop(); openVaultFile(readerTrail.at(-1)); };
translatePage();
load();
route();
setInterval(tick, 1000);
</script>
</body>
